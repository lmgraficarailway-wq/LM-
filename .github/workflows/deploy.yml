name: 🚀 Deploy LM PASSO – Firebase + Cloud Run

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar o código
      - name: Checkout código
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 3. Instalar dependências
      - name: Instalar dependências
        run: npm ci --omit=dev

      # 4. Autenticar no Google Cloud (Cloud Run)
      - name: Autenticar Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      # 5. Configurar gcloud CLI
      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: lm-passo

      # 6. Build e Deploy no Cloud Run
      - name: Deploy Cloud Run (API)
        run: |
          gcloud run deploy lm-passo-api \
            --source . \
            --region southamerica-east1 \
            --platform managed \
            --allow-unauthenticated \
            --quiet

      # 7. Deploy no Firebase Hosting (frontend)
      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: lm-passo
          channelId: live
